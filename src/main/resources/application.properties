spring.application.name=CareerVault
spring.datasource.url=jdbc:h2:file:./data/careervault;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
careervault.upload-dir=./uploads
careervault.cors.allowed-origin-patterns=${CAREERVAULT_CORS_ALLOWED_ORIGINS:*}
careervault.preparation-resource-dir=./uploads/preparation
careervault.course-image-dir=${CAREERVAULT_COURSE_IMAGE_DIR:./uploads/courses}
careervault.guidance.image-dir=${CAREERVAULT_GUIDANCE_IMAGE_DIR:./uploads/guidance}
careervault.auth.jwt-secret=${CAREERVAULT_JWT_SECRET:replace-this-development-secret-minimum-32-characters}
careervault.auth.bootstrap-admin-email=${CAREERVAULT_BOOTSTRAP_ADMIN_EMAIL:}
careervault.auth.bootstrap-admin-password=${CAREERVAULT_BOOTSTRAP_ADMIN_PASSWORD:}
